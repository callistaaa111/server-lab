<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 660" fill="none" stroke="#000" stroke-width="1.3" font-family="ui-monospace, Consolas, monospace" font-size="9">
  <!-- Margin art (assets/course.css uses it as a mask, so only the shape matters): a packet's path to the game, one-line diagram -->
  <g fill="#000" stroke="none">
    <text x="20" y="24">Packet path, one-line</text>
    <text x="20" y="38" font-size="8">checkpoints 1–5 · UDP 8211</text>
  </g>
  <!-- laptop -->
  <rect x="96" y="58" width="48" height="32" rx="2"/><path d="M88 96h64l-6 6H94z"/>
  <text x="160" y="80" fill="#000" stroke="none">laptop</text>
  <!-- to the internet -->
  <path d="M120 102v34" stroke-dasharray="4 3"/>
  <path d="M96 168c-14 0-18-16-6-20 0-12 16-16 22-8 6-10 26-8 26 6 12-2 18 14 6 22z"/>
  <text x="160" y="160" fill="#000" stroke="none">internet</text>
  <path d="M120 168v38" stroke-dasharray="4 3"/>
  <!-- 1 gateway: router symbol -->
  <circle cx="120" cy="226" r="20"/>
  <path d="M108 222h18l-5-5M132 230h-18l5 5" stroke-width="1.1"/>
  <text x="160" y="230" fill="#000" stroke="none">gateway</text>
  <path d="M120 246v34"/>
  <!-- 2 security list: wall -->
  <rect x="98" y="280" width="44" height="28"/>
  <path d="M98 289h44M98 299h44M112 280v9M128 280v9M106 289v10M120 289v10M134 289v10M112 299v9M128 299v9" stroke-width=".9"/>
  <text x="160" y="298" fill="#000" stroke="none">security list</text>
  <path d="M120 308v32"/>
  <!-- the server: outline around 3, 4, 5 -->
  <rect x="64" y="340" width="150" height="250" rx="6" stroke-dasharray="5 4"/>
  <text x="72" y="356" fill="#000" stroke="none">server 10.0.0.84</text>
  <path d="M120 340v28"/>
  <!-- 3 iptables -->
  <rect x="94" y="368" width="52" height="26" rx="2"/><path d="M102 376h36M102 382h36M102 388h24" stroke-width=".8"/>
  <text x="152" y="385" fill="#000" stroke="none">iptables</text>
  <path d="M120 394v34"/>
  <!-- 4 docker port map -->
  <rect x="94" y="428" width="52" height="26" rx="2"/><path d="M102 441h14M124 441h14M134 437l4 4-4 4" stroke-width=".9"/>
  <text x="152" y="445" fill="#000" stroke="none">docker</text>
  <path d="M120 454v34"/>
  <!-- 5 container -->
  <rect x="86" y="488" width="68" height="62" rx="3" stroke-width="1.6"/>
  <path d="M94 500h52M94 508h40M94 516h46" stroke-width=".8"/>
  <text x="120" y="538" fill="#000" stroke="none" text-anchor="middle">:8211</text>
  <text x="120" y="574" fill="#000" stroke="none" text-anchor="middle">container</text>
  <!-- checkpoint numbers -->
  <g stroke-width="1"><circle cx="76" cy="226" r="8"/><circle cx="76" cy="294" r="8"/><circle cx="76" cy="381" r="8"/><circle cx="76" cy="441" r="8"/><circle cx="76" cy="519" r="8"/></g>
  <g fill="#000" stroke="none" text-anchor="middle" font-size="9">
    <text x="76" y="229">1</text><text x="76" y="297">2</text><text x="76" y="384">3</text><text x="76" y="444">4</text><text x="76" y="522">5</text>
  </g>
  <path d="M84 226h16M84 294h14M84 381h10M84 441h10M84 519h2" stroke-width=".8" stroke-dasharray="2 2"/>
  <text x="20" y="626" fill="#000" stroke="none" font-size="8">if it stops at a checkpoint,</text>
  <text x="20" y="640" fill="#000" stroke="none" font-size="8">that checkpoint is the problem</text>
</svg>
